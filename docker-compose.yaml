services:
  web:
    build: .
    container_name: carebase
    restart: always
    expose:
      - "5000"
    depends_on:
      mariadb:
        condition: service_healthy
      mongodb:
        condition: service_started
  mariadb:
    image: mariadb:lts
    container_name: mariadb_container
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: 1234
    ports:
      - "3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    # wait until the DB is ready to go
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 10
  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    restart: always
    ports:
      - "27017"
    volumes:
      - mongodb_data:/data/db

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./nginx/key.pem:/etc/nginx/certs/key.pem:ro
    depends_on:
      - web

# used instead of bind mounts
volumes:
  mariadb_data:
  mongodb_data:


