<mat-card class="container-card" appearance="outlined">
  <section class="hero-section">
    <h1>System Configuration</h1>
  </section>
  <section class="card-grid" aria-label="Admin-Actions">
    <app-action-card
      title="Seed Test Database"
      description="Populates the environment with randomized mock datasets"
      icon="auto_fix_high"
      iconColor="secondary"
      buttonText="Seed Database"
      (actionClicked)="seedDb()"
    />
    <app-action-card
      title="Migrate to MongoDB"
      description="Extracts relational schemas and rows from MariaDB, transforms them into optimized MongoDB document collections, and builds production indexes."
      icon="drive_file_move"
      iconColor="secondary"
      buttonText="Run Migration"
      (actionClicked)="migrateDb()"
    />
  </section>
</mat-card>
