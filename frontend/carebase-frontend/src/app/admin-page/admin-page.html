<div class="hub-container">
  <header class="page-header">
    <div class="page-icon-wrapper">
      <mat-icon aria-hidden="true">admin_panel_settings</mat-icon>
    </div>
    <h1 class="page-title">System Administration & Data Operations</h1>
    <p class="page-subtitle">
      Populate synthetic clinical datasets for load evaluation and execute live runtime schema
      migration from MariaDB to MongoDB.
    </p>
  </header>

  <section class="card-grid" aria-label="Administrative Actions">
    <app-action-card
      title="Seed Test Database"
      description="Generate randomized synthetic patients, physicians, appointments, and treatments via bulk insertion."
      icon="dataset"
      iconColor="secondary"
      buttonText="Seed Database"
      (actionClicked)="seedDb()"
    />
    <app-action-card
      title="Execute NoSQL Migration"
      description="Transform relational SQL tables into optimized MongoDB document collections and swap active repository strategy."
      icon="storage"
      iconColor="primary"
      buttonText="Run Live Migration"
      (actionClicked)="migrateDb()"
    />
  </section>
</div>
