<mat-stepper linear>
  <mat-step>
    <form (submit)="$event.preventDefault()">
      <mat-form-field>
        <ng-template matStepLabel>Search for a Patient</ng-template>
        <mat-label>Patient</mat-label>
        <input matInput [matAutocomplete]="auto" />
        <mat-hint>Search by Name or SSNr</mat-hint>
      </mat-form-field>
      <mat-autocomplete #auto="matAutocomplete" requireSelection>
        @for (option of options(); track option) {
          <mat-option [value]="option">{{ option }}</mat-option>
        }
      </mat-autocomplete>
      <div>
        <button matButton matStepperNext>Next</button>
      </div>
    </form>
  </mat-step>
  <mat-step>
    <form (submit)="$event.preventDefault()">
      <ng-template matStepLabel>Select an Appointment</ng-template>
    </form>
  </mat-step>

  <mat-step>
    <form (submit)="$event.preventDefault()">
      <ng-template matStepLabel>Add a Treatment</ng-template>
    </form>
  </mat-step>
</mat-stepper>
