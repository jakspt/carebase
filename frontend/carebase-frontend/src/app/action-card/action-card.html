<mat-card appearance="outlined" class="action-card">
  <mat-card-header>
    @if (icon()) {
      <mat-icon mat-card-avatar class="card-icon" [class]="iconColor()">{{ icon() }}</mat-icon>
    }
    <mat-card-title>{{ title() }}</mat-card-title>
    <mat-card-subtitle>{{ description() }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content class="card-body">
    <!-- For additional content like filters etc. -->
    <ng-content></ng-content>
  </mat-card-content>
  <mat-card-actions align="end">
    <button matButton (click)="onButtonClick()">{{ buttonText() }}</button>
  </mat-card-actions>
</mat-card>
