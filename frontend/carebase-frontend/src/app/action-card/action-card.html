<p>action-card works!</p>

<mat-card appearance="outlined" class="action-card">
  <mat-card-header>
    @if (icon()) {
      <mat-icon mat-card-avatar class="card-icon" [style.color]="iconColor()">{{
        icon()
      }}</mat-icon>
    }
    <mat-card-title>{{ title() }}</mat-card-title>
    <mat-card-subtitle>Here is some content</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content class="card-body">
    <!-- For additional content like filters etc. -->
    <ng-content></ng-content>
  </mat-card-content>
  <mat-card-actions class="card-actions">
    <button matButton>click me</button>
  </mat-card-actions>
</mat-card>
