<div class="hub-container">
  <header class="page-header">
    <div class="page-icon-wrapper">
      <mat-icon aria-hidden="true">calendar_month</mat-icon>
    </div>
    <h1 class="page-title">Hospital Clerk Workspace</h1>
    <p class="page-subtitle">
      Coordinate patient intakes, schedule collision-free physician appointments, and monitor
      consultation volume metrics.
    </p>
  </header>

  <section class="card-grid" aria-label="Clerk Actions">
    <app-action-card
      title="Schedule Appointment"
      description="Book a conflict-free physician consultation slot for an active patient."
      icon="calendar_month"
      iconColor="primary"
      buttonText="Schedule Appointment"
      (actionClicked)="toUseCase()"
    />
    <app-action-card
      title="Visit Frequency Analytics"
      description="Analyze consultation volumes, patient return frequencies, and physician workload over custom date ranges."
      icon="analytics"
      iconColor="secondary"
      buttonText="View Frequency Report"
      (actionClicked)="toReport()"
    />
  </section>
</div>
